name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_integration:
        description: "Run sidecar integration tests"
        required: false
        default: false
        type: boolean
      sidecar_base_url:
        description: "Sidecar base URL for integration tests"
        required: false
        default: "http://127.0.0.1:8787"
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test
        env:
          CI: true

      - name: Build
        run: npm run build

      - name: Dependency audit (high+)
        run: npm run security:audit

      - name: Run sidecar integration tests
        if: github.event_name == 'workflow_dispatch' && inputs.run_integration
        run: npm run test:integration
        env:
          CI: true
          SIDECAR_BASE_URL: ${{ inputs.sidecar_base_url }}
